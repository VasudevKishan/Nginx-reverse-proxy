version: '3'
services:
  bookmark1:
    build: .
    image: bookmark-app:latest
    environment:
      - APP_NAME=bookmark1
    ports:
      - '3001:3000'

  bookmark2:
    image: bookmark-app:latest
    environment:
      - APP_NAME=bookmark2
    ports:
      - '3002:3000'

  bookmark3:
    image: bookmark-app:latest
    environment:
      - APP_NAME=bookmark3
    ports:
      - '3003:3000'

  nginx:
    image: nginx
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./nginx-docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-docker/certs:/etc/nginx/certs:ro
